# Gives this Spring Boot application a readable name in logs.
spring.application.name=student-registration
# Reads the local database address and permits MySQL public-key login for local development.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
# Reads the database username from the environment or uses the common local MySQL username.
spring.datasource.username=${DB_USERNAME:root}
# Requires the MySQL password to be supplied through the DB_PASSWORD environment variable.
spring.datasource.password=${DB_PASSWORD}
# Lets Hibernate update the local table structure to match the Java entity while learning.
spring.jpa.hibernate.ddl-auto=update
# Prints SQL statements so a beginner can see database work in the terminal.
spring.jpa.show-sql=true
# Makes printed SQL easier to read by placing clauses on separate lines.
spring.jpa.properties.hibernate.format_sql=true
# Avoids keeping database sessions open after a web request has finished.
spring.jpa.open-in-view=false
